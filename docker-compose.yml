services:
  backend:
    # 方案B：后端镜像同时配信前端静态资源（多阶段构建，上下文为仓库根目录）
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wnacg-downloader-backend
    environment:
      # 默认使用 SQLite（/app/data/manga.db，通过 volume 持久化）
      # 如需 PostgreSQL，设置 DATABASE_URL 环境变量即可（例: postgresql://user:pass@host:5432/db）
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/manga.db}
      MANGA_USERNAME: ${MANGA_USERNAME}
      MANGA_PASSWORD: ${MANGA_PASSWORD}
      PUBLISH_PAGE_URL: ${PUBLISH_PAGE_URL:-https://wn01.link}
      # 下载目录指向 Komga 的漫画库目录，实现自动同步
      DOWNLOAD_DIR: /app/downloads
      COVER_DIR: /app/covers
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: '["http://localhost:3000"]'
      # 最近更新搜索时排除的分类/作者名（JSON数组格式或逗号分隔）
      EXCLUDED_CATEGORIES: ${EXCLUDED_CATEGORIES:-["优秀","全部","管理分類","書架","书架","我的書架","一般","真人","同人"]}
    volumes:
      # 下载的漫画 - 与 Komga 共享同一个目录
      - ./komga-data:/app/downloads
      # 封面图片
      - ./backend/covers:/app/covers
      # SQLite 数据库文件
      - ./backend/data:/app/data
    ports:
      # 前端 + API 同一进程同源配信（访问入口）
      - "18000:8000"
    restart: unless-stopped
    networks:
      - wnacg-network

  komga:
    image: gotson/komga:latest
    container_name: komga
    restart: unless-stopped
    ports:
      - "25601:25600"
    environment:
      - TZ=Asia/Shanghai
      # 排除扫描的目录
      - KOMGA_LIBRARIES_SCAN_DIRECTORY_EXCLUSIONS=#recycle,@eaDir,@tmp
      # 服务器端口（容器内部端口，Komga 默认使用 25600）
      - KOMGA_SERVER_PORT=25600
    volumes:
      # Komga 配置文件目录
      - ./komga-config:/config
      # Komga 漫画库目录 - 与 backend 的下载目录共享
      - ./komga-data:/data
    networks:
      - wnacg-network

networks:
  wnacg-network:
    driver: bridge
