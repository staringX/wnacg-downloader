name: 构建并推送 Docker 镜像

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build-push.yml'
      - 'VERSION'
    tags:
      - 'v*.*.*'  # 匹配语义化版本号tag，如 v0.1.0
  workflow_dispatch: # 允许手动触发
    inputs:
      version_type:
        description: '版本号类型（如果VERSION文件不存在或需要手动指定）'
        required: false
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: 'auto'

env:
  DOCKER_REGISTRY: docker.io
  # 方案B：前端已合并进后端镜像，不再单独构建前端镜像
  BACKEND_IMAGE: staringx/wnacg-downloader-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写权限来推送VERSION文件
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于生成版本号
          token: ${{ secrets.GITHUB_TOKEN }}  # 需要token权限来推送VERSION文件
      
      - name: 生成版本号
        id: version
        run: |
          VERSION=""
          
          # 优先使用Git tag作为版本号（如果存在）
          if [ "${{ github.event_name }}" == "push" ] && [ -n "${{ github.ref }}" ]; then
            REF="${{ github.ref }}"
            if [[ "$REF" == refs/tags/* ]]; then
              VERSION=${REF#refs/tags/}
              # 移除v前缀（如果有）
              VERSION=${VERSION#v}
              echo "✅ 使用Git tag作为版本号: $VERSION"
              echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
              echo "BUMPED=false" >> $GITHUB_OUTPUT
              echo "最终版本号: $VERSION"
              exit 0
            fi
          fi
          
          # 从VERSION文件读取当前版本
          if [ -f "VERSION" ]; then
            CURRENT_VERSION=$(cat VERSION | tr -d ' \n')
            if [ -n "$CURRENT_VERSION" ]; then
              echo "📋 当前VERSION文件版本: $CURRENT_VERSION"
            fi
          else
            echo "⚠️  VERSION文件不存在，初始化为0.1.0"
            CURRENT_VERSION="0.1.0"
            echo "0.1.0" > VERSION
          fi
          
          # 默认自动递增补丁版本（patch）
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          # 递增patch版本（补丁版本，最后一位）
          PATCH=$((PATCH + 1))
          
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "$VERSION" > VERSION
          echo "✅ 自动递增补丁版本: $CURRENT_VERSION -> $VERSION"

          # VERSION文件的提交推迟到镜像推送成功之后（见最后的步骤）。
          # 构建失败时版本号だけが進んで実体のない版本が残るのを防ぐ。
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUMPED=true" >> $GITHUB_OUTPUT
          echo "最终版本号: $VERSION"

      # Buildx のブートは moby/buildkit を Docker Hub から取得するため、
      # 先にログインして認証済み pull にする（匿名 pull は制限・不調を受けやすい）。
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 设置 Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      # 一時的なネットワーク不調で buildkit の pull が失敗することがあるため、
      # 失敗時だけ 20 秒待って一度やり直す。
      - name: 设置 Docker Buildx（重试）
        if: steps.buildx.outcome == 'failure'
        run: sleep 20

      - name: 设置 Docker Buildx（第二次尝试）
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      # 方案B：后端镜像（多阶段构建）已内含前端静态资源，单镜像配信前端 + API
      - name: 构建并推送后端镜像（含前端）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest-amd64
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      # 镜像推送成功后にだけ VERSION を確定させる。
      # 途中で失敗した場合は VERSION が進まないので、次回の実行が同じ版本号で再試行できる。
      - name: 提交 VERSION 文件
        if: steps.version.outputs.BUMPED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if git diff --staged --quiet; then
            echo "ℹ️  VERSION文件无变更，跳过提交"
          else
            git commit -m "chore: auto bump version to ${{ steps.version.outputs.VERSION }} [skip ci]" || true
            # 使用GITHUB_TOKEN推送，避免触发新的workflow（因为有[skip ci]标记）
            git push origin HEAD:${{ github.ref_name }} || echo "⚠️  推送VERSION文件失败"
          fi

      - name: 输出镜像信息
        run: |
          echo "✅ 镜像构建完成（前端已合并进后端镜像）"
          echo "镜像: ${{ env.DOCKER_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.VERSION }}"
          echo "Latest-amd64标签已更新到版本: ${{ steps.version.outputs.VERSION }}"

